<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ST5SSPlayer · private listening room</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="landing-page">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <main class="landing-shell">
      <a class="brand brand-hero" href="/" aria-label="ST5SSPlayer">ST5SS<span>Player</span></a>
      <p class="eyebrow">Private listening room</p>
      <h1>A quiet place to share sound.</h1>
      <p class="landing-copy">
        This room is invite-only. Ask the host for a listener link, or open the private host link
        from the machine running the room.
      </p>
      <div class="landing-mark">
        <span class="privacy-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 5 6v5c0 4.4 2.9 8.3 7 9.6 4.1-1.3 7-5.2 7-9.6V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
          Audio is streamed live, held in memory, and never saved on the listener’s device.
        </span>
      </div>
    </main>
  </body>
</html>
